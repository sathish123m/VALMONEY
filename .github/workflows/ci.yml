name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch supersedes the run that is already going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: API — lint & test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22.x is the current LTS; 20.x and 24.x guard the edges of the range
        # declared in server/package.json.
        node-version: [20.x, 22.x, 24.x]

    defaults:
      run:
        working-directory: server

    env:
      # The suite never opens a database connection — it mounts the Express app
      # with supertest and checks contract behaviour. These values only satisfy
      # the config validator, the Prisma CLI (postinstall generate) and the JWT
      # signer.
      NODE_ENV: test
      DATABASE_URL: postgresql://valmoney:valmoney@localhost:5432/valmoney
      JWT_SECRET: ci-only-secret-that-is-definitely-long-enough

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  client:
    name: Web — lint, test & build (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
