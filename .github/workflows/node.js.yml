# Node.js CI workflow – clean, modern, and error-free

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]  # 24.x = Active LTS (primary recommendation), 20.x/22.x = Maintenance LTS
        # See: https://nodejs.org/en/about/previous-releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          # Remove or comment out the next line if you have no package-lock.json (or similar) in root
          # cache: 'npm'
          check-latest: true  # Always gets the newest patch version (e.g., latest 24.x)

      - name: Install dependencies
        run: npm ci

      - name: Build (if present)
        run: npm run build --if-present

      - name: Run tests
        run: npm test
