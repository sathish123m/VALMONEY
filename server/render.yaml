# Render blueprint — deploy the API and its database together.
#
#   1. Push this repository to GitHub.
#   2. Render dashboard → New → Blueprint → pick this repository and set
#      "Blueprint Path" to `server/render.yaml` (Render defaults to a
#      render.yaml at the repository root).
#   3. Apply. Both resources below are on the *Free* compute plan, so no
#      payment method is required.
#
# Free-instance trade-offs (see https://render.com/docs/free):
#   • the API spins down after 15 minutes idle and takes about a minute to
#     wake on the next request — the web client says so instead of hanging;
#   • outbound SMTP (ports 25/465/587) is blocked, so leave the MAIL_* values
#     unset and password-reset codes are printed to the service logs instead;
#   • the Free Postgres expires 30 days after creation unless the plan is
#     raised. For a database that does not expire, create a free one at
#     https://neon.com and set DATABASE_URL manually instead of the
#     `fromDatabase` entry below;
#   • the filesystem is ephemeral, so uploaded receipts are lost on redeploy.
#     Attach the disk at the bottom of this file on a paid instance to keep them.
#
# Deploying elsewhere (Railway, Fly, a VPS) needs the same three things:
# the build command, the start command and the environment variables below.
databases:
  - name: valmoney-db
    databaseName: valmoney
    user: valmoney
    region: oregon
    plan: free

services:
  - type: web
    # Named to match the VITE_API_URL already configured on the Vercel
    # project (https://valmoney-backend.onrender.com), so the deployed client
    # reaches this service without any environment change. Rename it and update
    # VITE_API_URL if the name is taken.
    name: valmoney-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    # `npm ci` also runs `prisma generate` through postinstall.
    buildCommand: npm ci
    # Migrations are applied on every deploy; `prisma migrate deploy` is
    # idempotent and never drops data.
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    # Rebuild only when the API changes — pushes that touch the client alone do
    # not need a new Node deploy.
    buildFilter:
      paths:
        - server/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: valmoney-db
          property: connectionString
      # Render generates and stores a 64-character secret for us.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Comma-separated list. Add every origin that should be allowed to call
      # the API — the Vercel production domain plus any preview domains.
      - key: CLIENT_ORIGIN
        value: https://valmoney.vercel.app
      # Receipts are written to ./uploads inside the deploy directory. A paid
      # instance with the disk below (and UPLOAD_DIR pointed at it) keeps them
      # across deploys; on Free they are lost when the service restarts.
      - key: MAX_UPLOAD_MB
        value: "10"
      # Email is optional. Free instances cannot open an SMTP connection, so
      # these stay unset and every code is written to the service logs as
      # `[mail:dev] … code=123456`. Add them on a paid instance to send mail:
      # MAIL_HOST / MAIL_USER / MAIL_PASS / MAIL_FROM (+ MAIL_PORT=587).
    # Persistent disk — requires a paid instance type on Render.
    # disk:
    #   name: valmoney-uploads
    #   mountPath: /var/valmoney
    #   sizeGB: 1
