# Render blueprint — deploy the API and its database together.
#
#   1. Push this repository to GitHub.
#   2. Render dashboard → New → Blueprint → pick this repository.
#   3. Fill in the values marked `sync: false` (SMTP credentials) and, if your
#      account has no free Postgres tier left, raise the database `plan`.
#
# Deploying elsewhere (Railway, Fly, a VPS) needs the same three things:
# the build command, the start command and the environment variables below.
databases:
  - name: valmoney-db
    databaseName: valmoney
    user: valmoney
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: valmoney-api
    runtime: node
    region: oregon
    rootDir: server
    # `npm ci` also runs `prisma generate` through postinstall.
    buildCommand: npm ci
    # Migrations are applied on every deploy; `prisma migrate deploy` is
    # idempotent and never drops data.
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: valmoney-db
          property: connectionString
      # Render generates and stores a 64-character secret for us.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Comma-separated list. Add every origin that should be allowed to call
      # the API — the Vercel production domain plus any preview domains.
      - key: CLIENT_ORIGIN
        value: https://valmoney.vercel.app
      # Receipt uploads. Persistent disks need a paid instance and are omitted
      # here so a free-tier blueprint deploys cleanly — on the free plan,
      # uploaded receipts disappear on redeploy. With a paid instance, uncomment
      # the `disk:` block at the bottom of this file and point UPLOAD_DIR at its
      # mount path (e.g. /var/valmoney/uploads).
      - key: UPLOAD_DIR
        value: /var/valmoney/uploads
      - key: MAX_UPLOAD_MB
        value: "10"
      # SMTP is optional: leave MAIL_FROM empty and the API logs emails instead
      # of sending them. Fill these in to deliver verification and reset codes.
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_SECURE
        value: "false"
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
    # Persistent disk — requires a paid instance type on Render.
    # disk:
    #   name: valmoney-uploads
    #   mountPath: /var/valmoney
    #   sizeGB: 1
